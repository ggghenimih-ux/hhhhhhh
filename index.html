<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="المتجر قيد الصيانة لتحديث قائمة المنتجات والأسعار. سنعود قريباً."
    />
    <title>الموقع قيد الصيانة | Outils Réparations GSM</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Cairo", system-ui, sans-serif;
        background: #0b1120;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(249 115 22 / 14%), transparent 55%),
          #0b1120;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 52px);
        border: 1px solid rgb(148 163 184 / 18%);
        border-radius: 28px;
        background: rgb(15 23 42 / 88%);
        box-shadow: 0 28px 80px rgb(0 0 0 / 38%);
        text-align: center;
      }

      .icon {
        display: grid;
        width: 76px;
        height: 76px;
        margin: 0 auto 26px;
        place-items: center;
        border: 1px solid rgb(249 115 22 / 32%);
        border-radius: 24px;
        background: rgb(249 115 22 / 12%);
        color: #fb923c;
        font-size: 36px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #fb923c;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(27px, 6vw, 38px);
        font-weight: 800;
        line-height: 1.45;
      }

      .message {
        margin: 18px 0 0;
        color: #cbd5e1;
        font-size: clamp(15px, 3.5vw, 18px);
        line-height: 1.9;
      }

      .note {
        margin: 14px 0 0;
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 32px;
        padding: 10px 16px;
        border: 1px solid rgb(148 163 184 / 16%);
        border-radius: 999px;
        background: rgb(30 41 59 / 70%);
        color: #cbd5e1;
        font-size: 13px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fb923c;
        box-shadow: 0 0 14px rgb(251 146 60 / 70%);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🛠️</div>
      <p class="eyebrow">Outils Réparations GSM · Tunisie</p>
      <h1>الموقع قيد الصيانة</h1>
      <p class="message">
        نقوم حالياً بتحديث قائمة المنتجات والأسعار لنقدم لكم تجربة أفضل.
      </p>
      <p class="note">سنعود للعمل قريباً. شكراً لثقتكم وتفهمكم.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span> تحديثات جارية</div>
    </main>
  </body>
</html>
